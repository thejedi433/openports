# Automated dependency vulnerability + version scanning.
# openports is a setup.py-based project (no lockfile), so the pip ecosystem
# scans pyproject/setup.py directly. Weekly cadence matches the fleet.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
